<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎵 MusicGrow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f0e17;font-family:'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif;color:#fffffe;min-height:100vh;overflow-x:hidden;}
input,select,textarea,button{font-family:inherit;}

/* ===== ONBOARDING ===== */
.ob-wrap{position:fixed;inset:0;background:#0f0e17;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.ob-logo{font-size:48px;margin-bottom:8px;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.ob-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#ff8906,#f25f4c,#e53170);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;text-align:center;}
.ob-sub{font-size:15px;color:#a7a9be;text-align:center;line-height:1.6;margin-bottom:40px;}
.ob-step{width:100%;max-width:400px;}
.ob-label{font-size:14px;color:#a7a9be;margin-bottom:16px;text-align:center;}
.ob-instruments{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;}
.ob-inst{background:#1a1a2e;border:2px solid #2a2a4a;border-radius:16px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .2s;}
.ob-inst:hover{border-color:#ff8906;background:#1e1a2e;}
.ob-inst.sel{border-color:#ff8906;background:#2a1a0e;box-shadow:0 0 20px rgba(255,137,6,0.3);}
.ob-inst-emoji{font-size:32px;display:block;margin-bottom:6px;}
.ob-inst-name{font-size:12px;color:#a7a9be;}
.ob-inst.sel .ob-inst-name{color:#ff8906;font-weight:700;}
.ob-inp{width:100%;background:#1a1a2e;border:2px solid #2a2a4a;border-radius:12px;padding:14px 16px;color:#fffffe;font-size:16px;outline:none;margin-bottom:24px;transition:border-color .2s;}
.ob-inp:focus{border-color:#ff8906;}
.ob-inp::placeholder{color:#555577;}
.ob-btn{width:100%;background:linear-gradient(135deg,#ff8906,#f25f4c);color:#fffffe;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;transition:opacity .2s;box-shadow:0 4px 20px rgba(255,137,6,0.4);}
.ob-btn:disabled{opacity:0.4;cursor:default;}
.ob-btn:not(:disabled):hover{opacity:0.9;}
.ob-dots{display:flex;gap:8px;justify-content:center;margin-bottom:32px;}
.ob-dot{width:8px;height:8px;border-radius:50%;background:#2a2a4a;transition:all .3s;}
.ob-dot.active{background:#ff8906;width:24px;border-radius:4px;}
.ob-skip{background:none;border:none;color:#555577;font-size:13px;cursor:pointer;margin-top:16px;text-decoration:underline;}

/* ===== MAIN APP ===== */
.app{display:none;}
.app.show{display:block;}

/* Header */
.header{padding:14px 20px;border-bottom:1px solid #1a1a2e;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(15,14,23,0.96);backdrop-filter:blur(12px);z-index:10;}
.logo-wrap{display:flex;align-items:center;gap:8px;}
.logo{font-size:16px;font-weight:900;background:linear-gradient(135deg,#ff8906,#f25f4c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:10px;color:#555577;}
.user-badge{display:flex;align-items:center;gap:8px;}
.user-inst{font-size:20px;}
.user-name{font-size:13px;font-weight:700;color:#fffffe;}

/* Nav */
.nav{display:flex;border-top:1px solid #1a1a2e;position:fixed;bottom:0;left:0;right:0;background:rgba(15,14,23,0.96);backdrop-filter:blur(12px);z-index:10;}
.nav-btn{flex:1;padding:10px 4px;border:none;background:none;color:#555577;font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s;}
.nav-btn.active{color:#ff8906;}
.nav-icon{font-size:22px;}

/* Content */
.content{padding:20px 20px 80px;max-width:480px;margin:0 auto;}

/* Cards */
.card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;padding:16px;margin-bottom:12px;}
.card-accent{border-color:#ff8906;background:linear-gradient(135deg,#1a1a2e,#1e1a0e);}
.card-label{font-size:11px;color:#a7a9be;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;}
.section-title{font-size:20px;font-weight:800;color:#fffffe;margin-bottom:16px;}

/* Inputs */
.inp{width:100%;background:#0f0e17;border:1px solid #2a2a4a;border-radius:10px;padding:10px 12px;color:#fffffe;font-size:14px;outline:none;transition:border-color .2s;}
.inp:focus{border-color:#ff8906;}
.inp::placeholder{color:#555577;}
textarea.inp{resize:none;height:64px;}

/* Buttons */
.btn{background:linear-gradient(135deg,#ff8906,#f25f4c);color:#fffffe;border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;width:100%;margin-top:10px;transition:opacity .2s;}
.btn:hover{opacity:0.9;}
.btn-ghost{background:none;border:1px solid #2a2a4a;color:#a7a9be;border-radius:10px;padding:10px 20px;font-size:13px;cursor:pointer;width:100%;margin-top:8px;}
.btn-red{background:linear-gradient(135deg,#f25f4c,#e53170);}
.chip{background:#0f0e17;border:1px solid #2a2a4a;border-radius:8px;padding:5px 12px;color:#a7a9be;font-size:12px;cursor:pointer;transition:all .2s;}
.chip.active{background:#2a1a0e;border-color:#ff8906;color:#ff8906;}

/* Stats */
.stat-bar{display:flex;gap:8px;margin-bottom:20px;}
.stat-box{flex:1;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:14px;padding:12px 8px;text-align:center;}
.stat-val{font-size:18px;font-weight:900;background:linear-gradient(135deg,#ff8906,#f25f4c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-lbl{font-size:10px;color:#555577;margin-top:3px;}

/* Progress */
.prog-bar{height:10px;border-radius:5px;background:#1a1a2e;margin:8px 0;overflow:hidden;}
.prog-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#ff8906,#f25f4c);transition:width .8s ease;}
/* Song completion */
.song-prog-bar{height:8px;border-radius:4px;background:#0f0e17;margin:6px 0;overflow:hidden;}
.song-prog-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.completion-badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;}

/* Stamps */
.stamp-grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
.stamp{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #2a2a4a;background:#0f0e17;transition:all .3s;}
.stamp.filled{border-color:#ff8906;background:#1e1a0e;transform:rotate(-8deg);}

/* Timer */
.timer-big{font-size:64px;font-weight:900;text-align:center;background:linear-gradient(135deg,#ff8906,#f25f4c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin:16px 0 4px;}
.sound-bar{height:6px;border-radius:3px;background:#1a1a2e;margin:10px 0;overflow:hidden;}
.sound-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#ff8906,#f25f4c);transition:width .1s;}

/* Karaoke score */
.karaoke-score{font-size:80px;font-weight:900;text-align:center;background:linear-gradient(135deg,#ff8906,#f25f4c,#e53170);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin:10px 0;}
.score-bar-bg{height:8px;border-radius:4px;background:#1a1a2e;overflow:hidden;margin:4px 0;}
.score-bar-fill{height:100%;border-radius:4px;transition:width 1.2s ease;}

/* AI analyzing */
.spinner{width:52px;height:52px;border:4px solid #1a1a2e;border-top:4px solid #ff8906;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.waveform{display:flex;align-items:center;gap:3px;justify-content:center;margin:16px 0;height:48px;}
.waveform-bar{width:5px;border-radius:3px;background:linear-gradient(180deg,#ff8906,#f25f4c);animation:wave 1.2s ease-in-out infinite;}
.waveform-bar:nth-child(2){animation-delay:.1s;height:60%;}
.waveform-bar:nth-child(3){animation-delay:.2s;height:90%;}
.waveform-bar:nth-child(4){animation-delay:.3s;height:70%;}
.waveform-bar:nth-child(5){animation-delay:.4s;height:100%;}
.waveform-bar:nth-child(6){animation-delay:.3s;height:80%;}
.waveform-bar:nth-child(7){animation-delay:.2s;height:60%;}
.waveform-bar:nth-child(8){animation-delay:.1s;height:40%;}
@keyframes wave{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1);}}

/* Calendar */
.cal{display:flex;flex-wrap:wrap;gap:4px;}
.cal-day{width:22px;height:22px;border-radius:5px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0f0e17;font-weight:700;}
.cal-day.done{background:linear-gradient(135deg,#ff8906,#f25f4c);}

/* Mood */
.mood-bar{display:flex;gap:10px;justify-content:center;}
.mood-bar span{font-size:30px;cursor:pointer;opacity:0.2;transition:all .15s;}
.mood-bar span.on{opacity:1;transform:scale(1.2);}

/* Tags */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
.tag{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:20px;padding:4px 12px;font-size:12px;color:#a7a9be;}

/* Misc */
.green{color:#ff8906;}
.muted{color:#a7a9be;}
.small{font-size:12px;}
.smaller{font-size:11px;color:#555577;}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.divider{height:1px;background:#1a1a2e;margin:16px 0;}

/* Metronome */
.beats{display:flex;justify-content:center;gap:12px;margin-bottom:24px;}
.beat-dot{width:24px;height:24px;border-radius:50%;background:#1a1a2e;transition:background .05s;}
.beat-dot.first{border:2px solid #ff8906;}
.beat-dot.other{border:2px solid #2a2a4a;}
.beat-dot.active-first{background:#ff8906;}
.beat-dot.active-other{background:#f25f4c;}
.bpm-num{font-size:60px;font-weight:900;text-align:center;background:linear-gradient(135deg,#ff8906,#f25f4c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
input[type=range]{width:100%;accent-color:#ff8906;margin:12px 0;}
svg text{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;}

/* Toast */
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);}60%{transform:translate(-50%,-50%) scale(1.15);}100%{transform:translate(-50%,-50%) scale(1);}}
</style>
</head>
<body>

<!-- ===== ONBOARDING ===== -->
<div class="ob-wrap" id="onboarding">
  <div id="ob-screen-1" class="ob-step">
    <div class="ob-logo">🎵</div>
    <div class="ob-title">MusicGrow</div>
    <div class="ob-sub">弾いた。記録された。<br>また弾きたくなった。</div>
    <div class="ob-dots">
      <div class="ob-dot active"></div>
      <div class="ob-dot"></div>
      <div class="ob-dot"></div>
    </div>
    <button class="ob-btn" onclick="obNext(1)">はじめる 🎶</button>
    <button class="ob-skip" onclick="obSkip()">スキップ</button>
  </div>

  <div id="ob-screen-2" class="ob-step" style="display:none">
    <div class="ob-label">🎸 どの楽器を演奏しますか？</div>
    <div class="ob-dots">
      <div class="ob-dot"></div>
      <div class="ob-dot active"></div>
      <div class="ob-dot"></div>
    </div>
    <div class="ob-instruments" id="ob-inst-grid">
      <div class="ob-inst" onclick="selectInst('ピアノ','🎹',this)"><span class="ob-inst-emoji">🎹</span><span class="ob-inst-name">ピアノ</span></div>
      <div class="ob-inst" onclick="selectInst('バイオリン','🎻',this)"><span class="ob-inst-emoji">🎻</span><span class="ob-inst-name">バイオリン</span></div>
      <div class="ob-inst" onclick="selectInst('ギター','🎸',this)"><span class="ob-inst-emoji">🎸</span><span class="ob-inst-name">ギター</span></div>
      <div class="ob-inst" onclick="selectInst('管楽器','🎺',this)"><span class="ob-inst-emoji">🎺</span><span class="ob-inst-name">管楽器</span></div>
      <div class="ob-inst" onclick="selectInst('ボーカル','🎤',this)"><span class="ob-inst-emoji">🎤</span><span class="ob-inst-name">ボーカル</span></div>
      <div class="ob-inst" onclick="selectInst('サックス','🎷',this)"><span class="ob-inst-emoji">🎷</span><span class="ob-inst-name">サックス</span></div>
      <div class="ob-inst" onclick="selectInst('ドラム','🥁',this)"><span class="ob-inst-emoji">🥁</span><span class="ob-inst-name">ドラム</span></div>
      <div class="ob-inst" onclick="selectInst('ベース','🎸',this)"><span class="ob-inst-emoji">🎸</span><span class="ob-inst-name">ベース</span></div>
      <div class="ob-inst" onclick="selectInst('その他','🎵',this)"><span class="ob-inst-emoji">🎵</span><span class="ob-inst-name">その他</span></div>
    </div>
    <button class="ob-btn" id="ob-btn-2" onclick="obNext(2)" disabled>次へ →</button>
  </div>

  <div id="ob-screen-3" class="ob-step" style="display:none">
    <div style="font-size:48px;text-align:center;margin-bottom:16px" id="ob-inst-emoji">🎵</div>
    <div class="ob-label">✏️ ニックネームを教えてください</div>
    <div class="ob-dots">
      <div class="ob-dot"></div>
      <div class="ob-dot"></div>
      <div class="ob-dot active"></div>
    </div>
    <input class="ob-inp" id="ob-name" placeholder="例：さくら、ひろと..." oninput="checkName()" maxlength="20">
    <button class="ob-btn" id="ob-btn-3" onclick="obFinish()" disabled>MusicGrowを始める 🎉</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app" id="mainApp">
  <div class="header">
    <div class="logo-wrap">
      <div>
        <div class="logo">🎵 MusicGrow</div>
        <div class="logo-sub">音楽の記録、成長の証</div>
      </div>
    </div>
    <div class="user-badge">
      <span class="user-inst" id="header-inst">🎵</span>
      <span class="user-name" id="header-name">ゲスト</span>
    </div>
  </div>

  <div class="content" id="app-content"></div>

  <div class="nav">
    <button class="nav-btn active" onclick="showTab('home')" id="nav-home">
      <span class="nav-icon">🏠</span>ホーム
    </button>
    <button class="nav-btn" onclick="showTab('practice')" id="nav-practice">
      <span class="nav-icon">🎤</span>練習
    </button>
    <button class="nav-btn" onclick="showTab('songs')" id="nav-songs">
      <span class="nav-icon">🎼</span>曲目
    </button>
    <button class="nav-btn" onclick="showTab('growth')" id="nav-growth">
      <span class="nav-icon">📊</span>成長
    </button>
    <button class="nav-btn" onclick="showTab('metro')" id="nav-metro">
      <span class="nav-icon">🎵</span>テンポ
    </button>
  </div>
</div>

<script>
// ============================================================
// Storage & Data
// ============================================================
const SK='musicgrow-v5';
function load(){try{const d=localStorage.getItem(SK);return d?JSON.parse(d):null;}catch{return null;}}
function save(d){try{localStorage.setItem(SK,JSON.stringify(d));}catch{}}

const INST_EMOJI={ピアノ:'🎹',バイオリン:'🎻',ギター:'🎸',管楽器:'🎺',ボーカル:'🎤',サックス:'🎷',ドラム:'🥁',ベース:'🎸',その他:'🎵'};
const MOODS=['😫','😕','😐','🙂','😄'];
const MINS_PER_STAMP=15;
const GOAL_HOURS=1000;

let DB=load()||null;
let curTab='home';
let audioTimer={active:false,analyzing:false,showReport:false,reportData:null,seconds:0,soundLevel:0,interval:null,stream:null,audioCtx:null,analyser:null,dataArray:null};
let metro={bpm:80,playing:false,beat:0,bpb:4,interval:null,ctx:null};
let pf={date:today(),minutes:30,content:'',mood:3,note:''};

// Onboarding state
let obInst='',obEmoji='🎵';

function today(){return new Date().toISOString().slice(0,10);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function getTotalMin(){return (DB.practices||[]).reduce((a,p)=>a+p.minutes,0);}
function getStreak(){
  const dates=[...new Set((DB.practices||[]).map(p=>p.date))].sort().reverse();
  if(!dates.length)return 0;
  let s=0,cur=new Date();cur.setHours(0,0,0,0);
  for(const d of dates){const pd=new Date(d);const diff=Math.round((cur-pd)/86400000);if(diff<=1){s++;cur=pd;}else break;}
  return s;
}
function getStamps(){return Math.floor(getTotalMin()/MINS_PER_STAMP);}

// ============================================================
// Onboarding
// ============================================================
function selectInst(name,emoji,el){
  obInst=name;obEmoji=emoji;
  document.querySelectorAll('.ob-inst').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('ob-btn-2').disabled=false;
}
function obNext(from){
  document.getElementById('ob-screen-'+(from)).style.display='none';
  document.getElementById('ob-screen-'+(from+1)).style.display='block';
  if(from===2) document.getElementById('ob-inst-emoji').textContent=obEmoji;
}
function checkName(){
  const v=document.getElementById('ob-name').value.trim();
  document.getElementById('ob-btn-3').disabled=v.length<1;
}
function obFinish(){
  const name=document.getElementById('ob-name').value.trim()||'ゲスト';
  initDB(name,obInst||'その他',obEmoji||'🎵');
  startApp();
}
function obSkip(){
  initDB('ゲスト','その他','🎵');
  startApp();
}
function initDB(name,inst,emoji){
  DB={name,instrument:inst,emoji,since:new Date().toISOString().slice(0,7),practices:[],aiScores:[],songs:[],settings:{showScore:true}};
  save(DB);
}
function startApp(){
  document.getElementById('onboarding').style.display='none';
  document.getElementById('mainApp').classList.add('show');
  document.getElementById('header-name').textContent=DB.name;
  document.getElementById('header-inst').textContent=DB.emoji;
  renderTab('home');
}

// ============================================================
// Check if already onboarded
// ============================================================
window.addEventListener('DOMContentLoaded',()=>{
  const d=load();
  if(d&&d.name){
    DB=d;
    document.getElementById('onboarding').style.display='none';
    document.getElementById('mainApp').classList.add('show');
    document.getElementById('header-name').textContent=DB.name;
    document.getElementById('header-inst').textContent=DB.emoji||'🎵';
    renderTab('home');
  }
});

// ============================================================
// Tab Navigation
// ============================================================
function showTab(tab){
  curTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+tab).classList.add('active');
  renderTab(tab);
}
function renderTab(tab){
  const el=document.getElementById('app-content');
  if(tab==='home') el.innerHTML=renderHome();
  else if(tab==='practice') el.innerHTML=renderPractice();
  else if(tab==='songs') el.innerHTML=renderSongs();
  else if(tab==='growth') el.innerHTML=renderGrowth();
  else if(tab==='stamp') el.innerHTML=renderStamp();
  else if(tab==='metro') el.innerHTML=renderMetro();
  if(tab==='practice'&&audioTimer.showReport&&audioTimer.reportData) animScore(audioTimer.reportData.score);
}

// ============================================================
// Render: Home
// ============================================================
function renderHome(){
  const totalMin=getTotalMin()+(audioTimer.active?Math.floor(audioTimer.seconds/60):0);
  const totalH=totalMin/60;
  const pct=Math.min(100,(totalH/GOAL_HOURS)*100);
  const streak=getStreak();
  const stamps=getStamps();
  const myScores=[...(DB.aiScores||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=myScores[myScores.length-1];

  let h=`
  <div style="margin-bottom:20px">
    <div style="font-size:24px;font-weight:900;color:#fffffe">おはよう、${DB.name}！ ${DB.emoji}</div>
    <div style="font-size:13px;color:#a7a9be;margin-top:4px">${DB.instrument} · ${DB.since}〜</div>
  </div>
  <div class="stat-bar">
    <div class="stat-box"><div class="stat-val">${streak}日</div><div class="stat-lbl">🔥 連続練習</div></div>
    <div class="stat-box"><div class="stat-val">${totalH.toFixed(1)}h</div><div class="stat-lbl">⏱ 累計時間</div></div>
    <div class="stat-box"><div class="stat-val">${stamps}💮</div><div class="stat-lbl">スタンプ</div></div>
  </div>

  <div class="card card-accent">
    <div class="card-label">🏆 1000時間への道</div>
    <div style="font-size:32px;font-weight:900;background:linear-gradient(135deg,#ff8906,#f25f4c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px">${totalH.toFixed(1)}<span style="font-size:16px;color:#a7a9be;-webkit-text-fill-color:#a7a9be"> / 1000時間</span></div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#555577;margin-top:4px">
      <span style="color:${totalH>=100?'#ff8906':'#555577'}">${totalH>=100?'✓':''} 100h</span>

  }

  let h=`

      </div>
    </div>
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span class="muted small">完成度</span>
        <span style="font-size:13px;font-weight:700;color:#ff8906">${sf.completion}%</span>
      </div>
      <input type="range" min="0" max="100" value="${sf.completion}" oninput="sf.completion=parseInt(this.value);document.getElementById('sf-prog').style.width=this.value+'%';document.getElementById('sf-pct').textContent=this.value+'%'">
      <div class="song-prog-bar"><div class="song-prog-fill" id="sf-prog" style="width:${sf.completion}%;background:${completionColor(sf.completion)}"></div></div>
    </div>
    <textarea class="inp" style="margin-top:8px;height:52px" placeholder="今日の気づき・メモ（任意）" oninput="sf.memo=this.value">${sf.memo}</textarea>

    h+=`<div class="card" style="text-align:center;padding:32px 16px">
      <div style="font-size:40px;margin-bottom:12px">🎼</div>
      <div style="color:#a7a9be;font-size:14px">練習している曲を登録しよう！<br>完成度が育っていく物語になります</div>
    </div>`;
    return h;
  }

  // Sort: 練習中 first, then 復習中, then 完成
  const order={練習中:0,復習中:1,完成:2};
  const sorted=[...songs].sort((a,b)=>(order[a.status]||0)-(order[b.status]||0));

  sorted.forEach(s=>{
    const color=completionColor(s.completion);
    const history=s.history||[];
    const latest=history[history.length-1];
    h+=`<div class="card" style="border-color:${s.completion>=100?'#ff8906':'#2a2a4a'}">

          <div style="font-weight:800;font-size:15px">${s.title}</div>
          ${s.composer?`<div style="font-size:11px;color:#555577;margin-top:2px">${s.composer}</div>`:''}
        </div>

      </div>
    </div>`;
  });

  return h;
}

      <button onclick="this.closest('div[style*=fixed]').remove()" style="flex:1;padding:12px;background:#0f0e17;border:1px solid #2a2a4a;border-radius:10px;color:#a7a9be;cursor:pointer">キャンセル</button>

function saveSongUpdate(id,overlay){
  const song=DB.songs.find(s=>s.id===id);
  if(!song)return;
  const slider=document.getElementById('modal-slider');
  const memo=document.getElementById('modal-memo').value;
  const statusBtn=overlay.querySelector('button[data-status][style*="ff8906"]');
  song.completion=parseInt(slider.value);
  if(statusBtn) song.status=statusBtn.dataset.status;
  if(song.completion>=100) song.status='完成';
  if(!song.history) song.history=[];
  song.history.push({date:today(),completion:song.completion,memo});
  save(DB);
  overlay.remove();
  showToast('✅ 更新しました！');
  renderTab('songs');
}

function deleteSong(id){
  if(!confirm('この曲を削除しますか？')) return;
  DB.songs=DB.songs.filter(s=>s.id!==id);
  save(DB);
  renderTab('songs');
}

function lineSVG(data,labels,color){
  if(data.length<2) return '<div style="color:#555577;font-size:12px;padding:8px 0">データが2件以上になると表示されます</div>';
  const w=280,h=90,pad=16;
  const mn=Math.min(...data),mx=Math.max(...data)+1;
  const xStep=(w-pad*2)/(data.length-1);
  const yScale=v=>pad+((mx-v)/(mx-mn||1))*(h-pad*2);
  let s=`<svg width="${w}" height="${h}" style="overflow:visible">`;
  for(let i=0;i<3;i++){const lv=mn+i*(mx-mn)/2;s+=`<line x1="${pad}" y1="${yScale(lv)}" x2="${w-pad}" y2="${yScale(lv)}" stroke="#1a1a2e" stroke-width="1"/>`;}
  const pts=data.map((v,i)=>`${pad+i*xStep},${yScale(v)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>`;
  data.forEach((v,i)=>s+=`<circle cx="${pad+i*xStep}" cy="${yScale(v)}" r="5" fill="${color}"/>`);
  if(labels)data.forEach((_,i)=>s+=`<text x="${pad+i*xStep}" y="${h+12}" text-anchor="middle" style="font-size:9px;fill:#555577">${labels[i]}</text>`);
  return s+'</svg>';
}

function calendarHTML(practices){
  const days=[];const t=new Date();t.setHours(0,0,0,0);
  for(let i=29;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);days.push(d.toISOString().slice(0,10));}
  const practiced=new Set(practices.map(p=>p.date));
  return '<div class="cal">'+days.map(d=>`<div class="cal-day${practiced.has(d)?' done':''}" title="${d}">${practiced.has(d)?'✓':''}</div>`).join('')+'</div>';
}

// ============================================================
// Render: Stamp
// ============================================================
function renderStamp(){
  const totalStamps=getStamps();
  const cardNum=Math.floor(totalStamps/20)+1;
  const stampsOnCard=totalStamps%20;
  const totalH=(getTotalMin()/60).toFixed(1);

  let h=`
  <div class="card card-accent">
    <div class="card-label">💮 スタンプカード（${cardNum}枚目）</div>
    <div style="font-size:12px;color:#a7a9be;margin-bottom:14px">15分練習ごとに1個 · 20個でコンプリート！🎉</div>
    <div class="stamp-grid">`;
  for(let i=0;i<20;i++) h+=`<div class="stamp${i<stampsOnCard?' filled':''}">${i<stampsOnCard?'💮':i+1}</div>`;
  h+=`</div>
    <div style="text-align:center;color:#a7a9be;font-size:13px;margin-top:10px">${stampsOnCard} / 20 個</div>
  </div>

  <div class="card">
    <div class="card-label">📊 累計データ</div>
    <div class="stat-bar">
      <div class="stat-box"><div class="stat-val">${totalStamps}</div><div class="stat-lbl">💮 総スタンプ</div></div>
      <div class="stat-box"><div class="stat-val">${cardNum}</div><div class="stat-lbl">🃏 カード枚数</div></div>
      <div class="stat-box"><div class="stat-val">${totalH}h</div><div class="stat-lbl">⏱ 累計時間</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">💮 スタンプの貯め方</div>
    <div style="font-size:13px;color:#a7a9be;line-height:2">
      🎤 音検知タイマーで自動獲得<br>
      ✏️ 手動記録でも獲得できます<br>
      15分 = 💮 1個<br>
      20個 = カード1枚コンプリート🎉
    </div>
  </div>`;

  return h;
}

// ============================================================
// Render: Metronome
// ============================================================
function renderMetro(){
  let dots='';
  for(let i=0;i<metro.bpb;i++){
    const isFirst=i===0;
    const isActive=metro.playing&&metro.beat===i;
    dots+=`<div class="beat-dot ${isFirst?'first':'other'}${isActive?(isFirst?' active-first':' active-other'):''}"></div>`;
  }
  return `<div class="card card-accent" style="text-align:center">
    <div class="card-label">🎵 メトロノーム</div>
    <div class="beats">${dots}</div>
    <div class="bpm-num">${metro.bpm}</div>
    <div style="color:#555577;font-size:12px;margin-bottom:16px">BPM</div>
    <input type="range" min="30" max="240" value="${metro.bpm}" oninput="setBpm(this.value)">
    <div class="chips" style="justify-content:center;margin-bottom:16px">
      ${[40,60,72,80,100,120,144,180].map(v=>`<button class="chip${metro.bpm===v?' active':''}" onclick="setBpm(${v})">${v}</button>`).join('')}
    </div>
    <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:24px">
      <span class="muted small">拍子</span>
      ${[2,3,4,6].map(v=>`<button class="chip${metro.bpb===v?' active':''}" onclick="setBpb(${v})">${v}拍</button>`).join('')}
    </div>
    <button class="btn${metro.playing?' btn-red':''}" onclick="toggleMetro()" style="font-size:18px;padding:16px">
      ${metro.playing?'⏹ 停止':'▶ スタート'}
    </button>
  </div>`;
}

// ============================================================
// Audio Timer
// ============================================================
async function startAudioTimer(){
  try{
    audioTimer.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioTimer.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const source=audioTimer.audioCtx.createMediaStreamSource(audioTimer.stream);
    audioTimer.analyser=audioTimer.audioCtx.createAnalyser();
    audioTimer.analyser.fftSize=256;
    source.connect(audioTimer.analyser);
    audioTimer.dataArray=new Uint8Array(audioTimer.analyser.frequencyBinCount);
    audioTimer.active=true;
    audioTimer.interval=setInterval(()=>{
      audioTimer.analyser.getByteFrequencyData(audioTimer.dataArray);
      const vol=audioTimer.dataArray.reduce((a,b)=>a+b,0)/audioTimer.dataArray.length;
      audioTimer.soundLevel=Math.min(100,vol*4);
      if(vol>12) audioTimer.seconds++;
      const te=document.getElementById('timer-display');
      if(te){const m=Math.floor(audioTimer.seconds/60),s=audioTimer.seconds%60;te.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
      const se=document.getElementById('sound-fill');
      if(se) se.style.width=audioTimer.soundLevel+'%';
      const de=document.getElementById('detecting-txt');
      if(de) de.textContent=audioTimer.soundLevel>20?'🎵 音を検知中...':'🎤 待機中...';
    },1000);
    renderTab('practice');
  }catch(e){alert('マイクへのアクセスを許可してください');}
}

function stopAudioTimer(){
  clearInterval(audioTimer.interval);
  if(audioTimer.stream) audioTimer.stream.getTracks().forEach(t=>t.stop());
  if(audioTimer.audioCtx) audioTimer.audioCtx.close();
  const secs=audioTimer.seconds;
  const inst=DB.instrument||'その他';
  if(secs>10){
    const mins=Math.max(1,Math.floor(secs/60));
    DB.practices.push({id:uid(),date:today(),minutes:mins,content:'🎤 自動計測',mood:3,note:`音検知タイマーで${mins}分記録`});
    save(DB);
  }
  audioTimer.active=false;
  audioTimer.analyzing=true;
  audioTimer.interval=null;
  audioTimer.stream=null;
  audioTimer.audioCtx=null;
  renderTab('practice');
  setTimeout(()=>{
    const report=generateReport(secs,inst);
    DB.aiScores.push({id:uid(),date:today(),...report});
    save(DB);
    audioTimer.analyzing=false;
    audioTimer.showReport=true;
    audioTimer.reportData=report;
    renderTab('practice');
    setTimeout(()=>animScore(report.score),200);
  },3000);
}

function closeReport(){
  audioTimer={active:false,analyzing:false,showReport:false,reportData:null,seconds:0,soundLevel:0,interval:null,stream:null,audioCtx:null,analyser:null,dataArray:null};
  renderTab('practice');
}

function animScore(target){
  const el=document.getElementById('karaoke-score-num');
  if(!el) return;
  let cur=0;const step=Math.ceil(target/60);
  const iv=setInterval(()=>{cur=Math.min(cur+step,target);el.textContent=cur;if(cur>=target)clearInterval(iv);},25);
}

function generateReport(seconds,instrument){
  const mins=Math.max(1,Math.floor(seconds/60));
  const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a));
  const breakdown={expression:rnd(70,96),accuracy:rnd(65,93),focus:rnd(72,97)};
  const score=Math.floor((breakdown.expression*0.35+breakdown.accuracy*0.35+breakdown.focus*0.3)*10.5);
  const advices={
    ピアノ:['音の粒立ちが前回より改善されています！右手のコントロールが向上しました。','テンポの安定感が増してきました。左手の音量バランスも意識してみましょう。','集中した練習でした！フレーズの歌い方がより自然になっています。'],
    バイオリン:['ボウイングの圧力が安定してきました！音色に温かみが出ています。','音程の精度が向上しています。ポジション移動をさらに磨きましょう。','表現の幅が広がっています！この調子で続けましょう。'],
    ギター:['コードの切り替えがスムーズになってきました！','リズムキープが安定しています。次はダイナミクスを意識してみましょう。','指の動きが自然になってきました。素晴らしい上達です！'],
    管楽器:['ブレスのタイミングが改善されました！フレーズの流れが自然です。','タンギングのキレが増しています。この調子で続けましょう！','音の立ち上がりが鋭くなりました。集中した練習の成果が出ています。'],
    ボーカル:['声の芯がしっかりしてきました！高音域での安定感が増しています。','フレーズの流れが自然になってきました。素晴らしい進歩です！','声量のコントロールが上達しています。表現力がアップしました！'],
  };
  const kwds={ピアノ:['#音の粒立ち','#テンポキープ','#右手強化','#表現力アップ','#集中力'],バイオリン:['#ボウイング','#音程精度','#ポジション','#音色改善'],ギター:['#コード切り替え','#リズム','#ダイナミクス','#指の動き'],管楽器:['#ブレス','#タンギング','#フレーズ感','#集中'],ボーカル:['#声の芯','#高音安定','#母音','#表現力']};
  const al=advices[instrument]||['今日も練習お疲れ様です！継続することが最大の上達の秘訣です。この調子で続けていきましょう！'];
  const kl=kwds[instrument]||['#継続は力','#着実な成長'];
  const keywords=[kl[Math.floor(Math.random()*kl.length)],kl[Math.floor(Math.random()*kl.length)]].filter((v,i,a)=>a.indexOf(v)===i);
  return {score,breakdown,advice:al[Math.floor(Math.random()*al.length)],keywords,minutes:mins};
}

// ============================================================
// Actions
// ============================================================
function addPractice(){
  if(!pf.content.trim()){alert('練習内容を入力してください');return;}
  DB.practices.push({id:uid(),...pf});
  pf={date:today(),minutes:30,content:'',mood:3,note:''};
  save(DB);
  showToast('✅ 記録しました！');
  renderTab('practice');
}

function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:2px solid #ff8906;border-radius:16px;padding:16px 32px;text-align:center;z-index:999;font-size:16px;font-weight:700;color:#ff8906;animation:pop .4s ease;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}

// Metronome
function playClick(accent){try{if(!metro.ctx)metro.ctx=new(window.AudioContext||window.webkitAudioContext)();const ctx=metro.ctx;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=accent?1200:800;gain.gain.setValueAtTime(accent?0.6:0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.1);}catch(e){}}
function setBpm(v){metro.bpm=parseInt(v);if(metro.playing){clearInterval(metro.interval);startMetroLoop();}renderTab('metro');}
function setBpb(v){metro.bpb=v;metro.beat=0;if(metro.playing){clearInterval(metro.interval);metro.playing=false;}renderTab('metro');}
function startMetroLoop(){metro.beat=0;playClick(true);metro.interval=setInterval(()=>{metro.beat=(metro.beat+1)%metro.bpb;playClick(metro.beat===0);const dots=document.querySelectorAll('.beat-dot');dots.forEach((d,i)=>{d.classList.remove('active-first','active-other');if(i===metro.beat)d.classList.add(i===0?'active-first':'active-other');});},(60/metro.bpm)*1000);}
function toggleMetro(){if(metro.playing){clearInterval(metro.interval);metro.playing=false;metro.beat=0;}else{metro.playing=true;startMetroLoop();}renderTab('metro');}
</script>
